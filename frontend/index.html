<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vehicular API - Desktop Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚗 Vehicular Desktop</h1>
    <div class="token-box">
      <input type="password" id="token" placeholder="Token json.pe">
      <button id="save-token">Guardar Token</button>
      <span id="token-status" class="muted">verificando...</span>
    </div>
  </header>

  <main>
    <div class="search-bar" id="search-bar">
      <div class="field">
        <label for="placa-input">Placa</label>
        <input id="placa-input" type="text" placeholder="ABC123" maxlength="10">
      </div>
      <div class="field">
        <label for="dni-input">DNI <span class="muted">(opcional)</span></label>
        <input id="dni-input" type="text" placeholder="12345678" maxlength="8">
      </div>
      <button class="primary" id="search-all-btn">Consultar</button>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="placa">Placa <span class="tab-dot" data-for="placa"></span></button>
      <button class="tab" data-tab="soat">SOAT <span class="tab-dot" data-for="soat"></span></button>
      <button class="tab" data-tab="licencia">Licencia <span class="tab-dot" data-for="licencia"></span></button>
      <button class="tab" data-tab="historial">Historial Local</button>
    </nav>

    <div id="result-view">
      <div class="result-card">
        <div class="result-header">
          <span id="result-badge" class="badge badge-neutral">Sin consulta</span>
          <span id="result-message" class="result-message"></span>
          <div class="result-actions">
            <button id="copy-btn" class="ghost" disabled>Copiar</button>
            <button id="toggle-raw" class="ghost" disabled>Ver JSON</button>
          </div>
        </div>
        <div id="result-body" class="result-body">
          <p class="muted">Esperando consulta…</p>
        </div>
      </div>
    </div>

    <div id="hist-view" style="display:none">
      <div class="row" style="margin-bottom:10px">
        <button id="refresh-hist">Actualizar Historial</button>
      </div>
      <div id="hist-list" class="hist-list">
        <p class="muted">sin consultas guardadas</p>
      </div>
    </div>

    <div id="status" class="status"></div>
  </main>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
